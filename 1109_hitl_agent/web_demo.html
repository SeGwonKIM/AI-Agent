        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .btn-run {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-run:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-reset {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset:hover { color: var(--text-main); border-color: var(--text-main); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stat-label { color: var(--text-muted); font-size: 14px; margin-bottom: 6px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-value.danger { color: var(--danger); }
        .stat-value.success { color: var(--success); }

        .pending-section { margin-bottom: 36px; }
        .section-title { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        @media(max-width: 860px) { .task-card { grid-template-columns: 1fr; } }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-info { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }

        .reason-box {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
            font-size: 14px;
        }
        .consequence-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warning);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 14px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        input[type="text"], textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--primary); }
        .action-btns { display: flex; gap: 8px; margin-top: 14px; }
        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.15s;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-approve { background: var(--success); color: white; }
        .btn-edit { background: var(--warning); color: #1e293b; }
        .btn-reject { background: var(--danger); color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: rgba(0, 0, 0, 0.2); color: var(--text-muted); font-weight: 600; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--success);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            display: none;
            z-index: 100;
            font-weight: 500;
        }
    </style>
</head>

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function resetToInitial() {
            taskData = JSON.parse(JSON.stringify(INITIAL_DATA));
            renderUI();
            showToast("🔄 모든 데이터와 승인 대기열이 초기 상태로 리셋되었습니다.");
        }

        function runBatch() {
            renderUI();
            showToast("🚀 8개 콘텐츠 배치 파이프라인 정밀 평가가 완료되었습니다!");
        }

        function handleAction(taskId, action) {
            const task = taskData.find(t => t.task_id === taskId);
            if (!task) return;

            const caption = document.getElementById(`cap-${taskId}`)?.value || task.caption;
            const tags = document.getElementById(`tag-${taskId}`)?.value || task.hashtags.join(', ');
            const comment = document.getElementById(`comm-${taskId}`)?.value || '';

            const now = new Date().toTimeString().split(' ')[0];

            if (action === 'approve') {
                task.approval_status = 'approved';
                task.is_published = true;
                task.published_at = `2026-11-09 ${now}`;
                task.comment = comment ? `[인간 즉시 승인] ${comment}` : '[인간 즉시 승인] 검수 통과 확인';
                showToast(`✅ ${taskId} 건이 즉시 승인되어 틱톡 공식 채널에 발행되었습니다!`);
            } else if (action === 'edit_and_approve') {
                task.approval_status = 'edited_and_approved';
                task.caption = caption;
                task.hashtags = tags.split(',').map(t => t.trim()).filter(Boolean);
                task.is_published = true;
                task.published_at = `2026-11-09 ${now}`;
                task.comment = comment ? `[인간 수정 승인] ${comment}` : `[인간 수정 승인] 캡션/태그 보강 후 발행`;
                showToast(`🛠️ ${taskId} 건이 수정 후 승인되어 발행되었습니다!`);
            } else if (action === 'reject') {
                task.approval_status = 'rejected';
                task.is_published = false;
                task.comment = comment ? `[인간 반려] ${comment}` : '[인간 반려] 기준 미달로 발행 취소';
                showToast(`❌ ${taskId} 건이 최종 반려되어 발행이 취소되었습니다.`);
            }

            renderUI();
        }

        function renderUI() {
            const pendingTasks = taskData.filter(t => t.approval_status === 'pending_human');
            const autoPassed = taskData.filter(t => t.approval_status === 'auto_approved').length;
            const reviewed = taskData.filter(t => ['approved', 'edited_and_approved', 'rejected'].includes(t.approval_status)).length;

            document.getElementById('stat-total').innerText = taskData.length;
            document.getElementById('stat-auto').innerText = autoPassed;
            document.getElementById('stat-pending').innerText = pendingTasks.length;
            document.getElementById('stat-reviewed').innerText = reviewed;

            const pendingContainer = document.getElementById('pending-container');
            if (pendingTasks.length === 0) {
                pendingContainer.innerHTML = '<div style="background: var(--surface); padding: 28px; border-radius: 12px; border: 1px dashed var(--success); text-align: center; color: var(--success); font-weight: 600; font-size: 16px;">🎉 현재 승인 대기 중인 항목이 없습니다. (모든 중단 건의 의사결정이 완료되었습니다)</div>';
            } else {
                pendingContainer.innerHTML = pendingTasks.map(t => `
                    <div class="task-card">
                        <div>
                            <div style="margin-bottom: 8px;">
                                <span class="badge badge-info">${t.country}</span>
                                <span class="badge badge-danger">위험도: ${(t.risk_score * 100).toFixed(0)}%</span>
                                <strong>${t.task_id}</strong> - ${t.channel_name}
                            </div>
                            <h3 style="font-size: 16px; margin-bottom: 8px;">🎬 ${t.raw_title}</h3>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                                미디어: <code>${t.media_file}</code> | 영상길이: <strong>${t.duration_seconds}초</strong> | 누적발행: ${t.cumulative_uploads}회
                            </p>

                            <div class="reason-box">
                                <strong>🚨 파이프라인이 멈춘 이유 (기준 위반 사항):</strong>
                                <ul style="margin-left: 18px; margin-top: 4px;">
                                    ${t.criteria_failures.map(f => `<li>${f}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="consequence-box">
                                <strong>⚡ 통과시키면 일어나는 일:</strong><br>
                                즉시 ${t.country} 현지 틱톡 공식 채널(${t.channel_name})로 영상이 영구 게시되며 전 세계 구독자에게 푸시 알림이 발송됩니다.
                            </div>
                        </div>

                        <div>
                            <div class="form-group">
                                <label>캡션 (설명글)</label>
                                <textarea id="cap-${t.task_id}" rows="3">${t.caption}</textarea>
                            </div>
                            <div class="form-group">
                                <label>해시태그 (쉼표로 구분)</label>
                                <input type="text" id="tag-${t.task_id}" value="${t.hashtags.join(', ')}">
                            </div>
                            <div class="form-group">
                                <label>검수 코멘트 (사유 입력)</label>
                                <input type="text" id="comm-${t.task_id}" placeholder="예: 캡션 민감어 제거 및 태그 보강 후 승인">
                            </div>

                            <div class="action-btns">
                                <button class="btn btn-approve" onclick="handleAction('${t.task_id}', 'approve')">✅ 즉시 승인</button>
                                <button class="btn btn-edit" onclick="handleAction('${t.task_id}', 'edit_and_approve')">🛠️ 수정 후 승인</button>
                                <button class="btn btn-reject" onclick="handleAction('${t.task_id}', 'reject')">❌ 반려</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            const allTbody = document.getElementById('all-tasks-tbody');
            allTbody.innerHTML = taskData.map(t => {
                let badgeClass = 'badge-info';
                let statusName = t.approval_status;
                if (t.approval_status === 'auto_approved') { badgeClass = 'badge-success'; statusName = '전자동 통과'; }
                else if (t.approval_status === 'approved') { badgeClass = 'badge-success'; statusName = '인간 승인 완료'; }
                else if (t.approval_status === 'edited_and_approved') { badgeClass = 'badge-info'; statusName = '수정 승인 완료'; }
                else if (t.approval_status === 'rejected') { badgeClass = 'badge-danger'; statusName = '반려(취소)'; }
                else if (t.approval_status === 'pending_human') { badgeClass = 'badge-danger'; statusName = '승인 대기 중'; }

                return `
                    <tr>
                        <td><strong>${t.task_id}</strong></td>
                        <td>${t.channel_name} (${t.country})</td>
                        <td><code>${t.media_file}</code></td>
                        <td>${t.duration_seconds}초</td>
                        <td><span class="badge ${badgeClass}">${statusName}</span></td>
                        <td>${t.is_published ? '✅ 틱톡 게시됨 (' + (t.published_at ? t.published_at.slice(11) : '완료') + ')' : '⛔ 미게시'}</td>
                        <td style="color: var(--text-muted); font-size: 13px;">${t.comment || '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = renderUI;
    </script>
</body>
</html>
